name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Android APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Validates official Gradle Wrapper checksums to prevent supply chain tampering.
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      # Ensure execute permissions on the gradlew script
      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      # Generate debug.keystore in repository root if it does not exist
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI signing..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists, skipping generation."
          fi

      # Execute local JVM unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Upload Test Reports if tests fail for easy debugging
      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      # Build debug APK package
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Upload the generated APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeaconLens-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
